services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-school_bell_root}
      MYSQL_DATABASE: ${DB_NAME:-school_bell}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-school_bell_root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-school_bell_root}
      DB_NAME: ${DB_NAME:-school_bell}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      UPLOAD_DIR: uploads
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302,stun:stun.cloudflare.com:3478}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      LIVE_OFFER_TIMEOUT_MS: ${LIVE_OFFER_TIMEOUT_MS:-15000}
      LIVE_ANSWER_TIMEOUT_MS: ${LIVE_ANSWER_TIMEOUT_MS:-15000}
      LIVE_ICE_TIMEOUT_MS: ${LIVE_ICE_TIMEOUT_MS:-20000}
      LIVE_CONNECTION_TIMEOUT_MS: ${LIVE_CONNECTION_TIMEOUT_MS:-30000}
      LIVE_SESSION_MAX_MS: ${LIVE_SESSION_MAX_MS:-7200000}
      LIVE_ICE_RETRY_MS: ${LIVE_ICE_RETRY_MS:-2000}
      LIVE_ICE_RETRY_MAX: ${LIVE_ICE_RETRY_MAX:-5}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
